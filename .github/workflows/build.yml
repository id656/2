name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android project
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts не найден. Файлы проекта не загружены. Содержимое репозитория:"
            find . -not -path './.git/*' -type f | head -50
            exit 1
          fi
          D=$(cd "$(dirname "$F")" && pwd)
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Rust + cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - name: Build tun2proxy native library
        run: |
          git clone https://github.com/tun2proxy/tun2proxy.git /tmp/tun2proxy
          cd /tmp/tun2proxy
          git checkout v0.8.0 || git checkout 0.8.0
          cargo ndk -t arm64-v8a -t armeabi-v7a -o "$PROJECT_DIR/app/src/main/jniLibs" build --release --lib

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SuperProxy-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
